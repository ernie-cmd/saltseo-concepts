<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Концепты SALTSEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;600&display=swap">
<style>
/* Разводящая: четыре превью главной в сетке 2×2, фирменные цвета SALTSEO, прямые углы. Один светлый вид намеренно. */
:root{--bg:#F2F2F0;--card:#FFFFFF;--ink:#000000;--muted:#5E5E5E;--accent:#2F7F14;--font:'Onest','Helvetica Neue',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16px/1.5 var(--font)}
main{max-width:1280px;margin:0 auto;padding-block:clamp(24px,4vw,56px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{margin:0 0 8px;font:600 clamp(28px,3.6vw,46px)/1.08 var(--font);letter-spacing:-0.03em;text-wrap:balance}
h1 span{color:var(--accent)}
.sub{margin:0 0 clamp(24px,3vw,40px);color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.c{display:flex;flex-direction:column;min-width:0;background:var(--card);border-top:3px solid var(--ink);text-decoration:none;color:inherit;transition:border-color 200ms ease}
.c:hover{border-top-color:var(--accent)}
.c:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shot{position:relative;aspect-ratio:16 / 10;max-width:100%;overflow:hidden;background:var(--bg)}
.shot::before{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;font:600 64px/1 var(--font);color:#D8D8D4}
.shot iframe{position:absolute;top:0;left:0;width:1440px;height:900px;border:0;transform-origin:0 0;pointer-events:none;background:var(--card)}
.txt{display:flex;flex-direction:column;gap:6px;padding:20px 22px 24px}
.txt b{font:600 21px/1.2 var(--font);letter-spacing:-0.01em}
.txt p{margin:0;color:var(--muted)}
.go{margin-top:8px;font-weight:600;color:var(--accent)}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.c{transition:none}}
</style>
</head>
<body>
<main>
  <h1 style="margin-bottom:clamp(24px,3vw,40px)">SALT<span>/</span>SEO: 4 концепта главной</h1>
  <div class="grid">
    <a class="c" href="concept-1.html"><div class="shot" data-n="1"><iframe src="concept-1.html" title="1 концепт" loading="lazy" tabindex="-1"></iframe></div><div class="txt"><b>1 концепт</b></div></a>
    <a class="c" href="concept-2.html"><div class="shot" data-n="2"><iframe src="concept-2.html" title="2 концепт" loading="lazy" tabindex="-1"></iframe></div><div class="txt"><b>2 концепт</b></div></a>
    <a class="c" href="concept-3.html"><div class="shot" data-n="3"><iframe src="concept-3.html" title="3 концепт" loading="lazy" tabindex="-1"></iframe></div><div class="txt"><b>3 концепт</b></div></a>
    <a class="c" href="concept-4.html"><div class="shot" data-n="4"><iframe src="concept-4.html" title="4 концепт" loading="lazy" tabindex="-1"></iframe></div><div class="txt"><b>4 концепт</b></div></a>
  </div>
</main>

<script>
// Превью: страница 1440×900 масштабируется под ширину карточки
function fit(){document.querySelectorAll('.shot').forEach(function(s){s.querySelector('iframe').style.transform='scale('+(s.clientWidth/1440)+')';});}
addEventListener('resize',fit);fit();
</script>
</body>
</html>
